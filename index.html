<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#3a2a16" />
<title>Beelzebub's Tales</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
<meta name="apple-mobile-web-app-title" content="Beelzebub" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>
<style>
  :root { color-scheme: light dark; }
  * { -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Crimson Pro', Georgia, serif; }
  html, body, #root { height: 100%; }
  body { overscroll-behavior-y: none; }

  /* themes */
  .theme-sepia { background: #faf6ef; color: #2b2620; }
  .theme-sepia .surface   { background: #f3ecdc; }
  .theme-sepia .surface-2 { background: #ebe1cb; }
  .theme-sepia .muted     { color: #6a5d48; }
  .theme-sepia .border-soft { border-color: #d9cdb0; }
  .theme-sepia .accent    { color: #8a5a2b; }
  .theme-sepia .accent-bg { background: #8a5a2b; }
  .theme-sepia .anchor-tag { color: #b48854; background: #ede2c8; }

  .theme-dark { background: #1a1814; color: #e9e2d4; }
  .theme-dark .surface   { background: #25221c; }
  .theme-dark .surface-2 { background: #2e2a22; }
  .theme-dark .muted     { color: #9a9080; }
  .theme-dark .border-soft { border-color: #3a352c; }
  .theme-dark .accent    { color: #d4a574; }
  .theme-dark .accent-bg { background: #8a5a2b; }
  .theme-dark .anchor-tag { color: #d4a574; background: #2e2a22; }

  .theme-light { background: #ffffff; color: #1a1a1a; }
  .theme-light .surface   { background: #f7f5f1; }
  .theme-light .surface-2 { background: #efece5; }
  .theme-light .muted     { color: #6b6258; }
  .theme-light .border-soft { border-color: #e5e0d4; }
  .theme-light .accent    { color: #7a4a1c; }
  .theme-light .accent-bg { background: #7a4a1c; }
  .theme-light .anchor-tag { color: #7a4a1c; background: #f1eadb; }

  /* Reading column: optimal measure for English prose */
  .prose-col { max-width: 38em; margin-inline: auto; }

  /* Paragraph + margin anchor.
     On wide screens the anchor sits in the left margin (negative offset);
     on narrow screens it inlines as a small tag above the paragraph. */
  .para { position: relative; padding-left: 0; margin: 1.05em 0; line-height: 1.75; }
  .para .anchor-tag {
    display: inline-block;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 0.72rem;
    letter-spacing: 0.02em;
    padding: 1px 6px;
    border-radius: 4px;
    user-select: all;  /* easy to copy the citation */
  }
  @media (min-width: 640px) {
    .para { padding-left: 0; }
    .para .anchor-tag {
      position: absolute;
      left: -5.5em;
      top: 0.45em;
      width: 4.5em;
      text-align: end;
      background: transparent !important;
    }
  }
  @media (max-width: 639px) {
    .para .anchor-tag { margin-bottom: 0.25em; }
  }

  /* Dropcap for the opening paragraph of each chapter */
  .para-opener .anchor-tag { opacity: 0.6; }
  .para-opener > .body::first-letter {
    font-size: 3.2em;
    float: left;
    line-height: 0.92;
    padding-right: 0.08em;
    padding-top: 0.05em;
    font-weight: 500;
  }

  /* Chapter ornament */
  .ornament { text-align: center; letter-spacing: 0.6em; opacity: 0.35; user-select: none; }

  /* Safe-area helpers for iOS.
     !important is needed because Tailwind's CDN stylesheet loads after this
     block, so without it `py-3` (padding-top:0.75rem) would override pt-safe
     and the iPhone status bar would overlap the header on installed PWAs. */
  .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 0.5rem) !important; }
  .pt-safe { padding-top: calc(env(safe-area-inset-top, 0px) + 0.75rem) !important; }

  .fade-in { animation: fadeIn 0.25s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* Highlight on jumped-to paragraph */
  .para.flash > .body {
    background-color: var(--flash-bg, rgba(180, 136, 84, 0.22));
    transition: background-color 1.5s ease-out;
    border-radius: 4px;
    padding: 4px 6px;
    margin-left: -6px;
  }

  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>
<body class="theme-sepia">
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* =========================================================================
   ROUTING & STORAGE
   ========================================================================= */
function parseHash() {
  const h = (window.location.hash || '#/').slice(1);
  const parts = h.split('/').filter(Boolean);
  if (parts.length === 0) return { tab: 'home' };
  if (parts[0] === 'ch' && parts[1]) {
    return { tab: 'reader', chapter: parseInt(parts[1], 10), anchor: parts[2] || null };
  }
  // 'browse' is an alias for 'home' so old links keep working.
  if (parts[0] === 'browse') return { tab: 'home' };
  if (['home', 'search', 'settings'].includes(parts[0])) {
    return { tab: parts[0] };
  }
  return { tab: 'home' };
}
function setHash(route) {
  const h = route.tab === 'reader'
    ? `#/ch/${route.chapter}${route.anchor ? '/' + route.anchor : ''}`
    : `#/${route.tab === 'home' ? '' : route.tab}`;
  if (window.location.hash !== h) window.location.hash = h;
}

const LS = {
  get(k, fallback) {
    try { const v = localStorage.getItem(k); return v == null ? fallback : JSON.parse(v); }
    catch { return fallback; }
  },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

/* =========================================================================
   ANCHOR QUERY DETECTION
   The print uses <chapter>.<page>(-<endPage>), where the end-page is the
   trailing-digit abbreviation of the full end (e.g. 48.1210-1 = 1210..1211).
   A query consisting only of digits / "." / "-" is treated like a PDF text
   search: substring-match against every paragraph's anchor string.
   ========================================================================= */
function isAnchorQuery(s) {
  const t = (s || '').trim();
  return t.length > 0 && /^[\d.\-]+$/.test(t);
}

/* =========================================================================
   DATA LAYER — fetch manifest + chapters on demand, cache in memory
   ========================================================================= */
const DATA_DIR = 'data/';
const chapterCache = new Map();   // number -> chapter JSON
let manifestCache = null;

async function loadManifest() {
  if (manifestCache) return manifestCache;
  const r = await fetch('MANIFEST.json');
  if (!r.ok) throw new Error('manifest fetch failed: ' + r.status);
  manifestCache = await r.json();
  return manifestCache;
}
async function loadChapter(n) {
  if (chapterCache.has(n)) return chapterCache.get(n);
  const path = `${DATA_DIR}ch${String(n).padStart(2, '0')}.json`;
  const r = await fetch(path);
  if (!r.ok) throw new Error(`chapter ${n} fetch failed: ` + r.status);
  const doc = await r.json();
  chapterCache.set(n, doc);
  return doc;
}

/* =========================================================================
   THEMES, FONTS, SIZES
   ========================================================================= */
const THEMES = [
  { id: 'sepia', label: 'Sepia', emoji: '📜' },
  { id: 'light', label: 'Light', emoji: '☀️' },
  { id: 'dark',  label: 'Dark',  emoji: '🌙' },
];
const FONTS = [
  { id: 'crimson', label: 'Crimson Pro', stack: "'Crimson Pro', Georgia, serif" },
  { id: 'lora',    label: 'Lora',        stack: "'Lora', Georgia, serif" },
];
// Root font-size: Tailwind's text-* utilities and the .anchor-tag/.prose-col
// rules all use rem, so scaling <html> font-size scales the whole UI at once.
// Chosen so chapter body (rendered as text-lg = 1.125rem) lands at ~16/18/20/24
// — close to the previous absolute pixel sizes.
const FONT_SIZES = [
  { id: 'sm', label: 'Small',   rootPx: 14 },
  { id: 'md', label: 'Medium',  rootPx: 16 },
  { id: 'lg', label: 'Large',   rootPx: 18 },
  { id: 'xl', label: 'X-Large', rootPx: 21 },
];

/* =========================================================================
   APP
   ========================================================================= */
function App() {
  const [route, setRoute] = useState(parseHash());
  const [theme, setTheme] = useState(LS.get('beel:theme', 'sepia'));
  const [font, setFont]   = useState(LS.get('beel:font', 'crimson'));
  const [fontSize, setFontSize] = useState(LS.get('beel:size', 'md'));
  const [favorites, setFavorites] = useState(new Set(LS.get('beel:fav', [])));
  const [manifest, setManifest] = useState(null);
  const [error, setError] = useState(null);

  // Listen to hash changes (back/forward, manual edits, deep links)
  useEffect(() => {
    const onHash = () => setRoute(parseHash());
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  // Apply theme + font to body, font-size to <html> (so rem-based UI scales)
  useEffect(() => {
    document.body.className = `theme-${theme}`;
    document.body.style.fontFamily = FONTS.find(f => f.id === font).stack;
  }, [theme, font]);
  useEffect(() => {
    const cfg = FONT_SIZES.find(s => s.id === fontSize);
    document.documentElement.style.fontSize = cfg ? `${cfg.rootPx}px` : '';
  }, [fontSize]);

  // Persist preferences
  useEffect(() => { LS.set('beel:theme', theme); }, [theme]);
  useEffect(() => { LS.set('beel:font', font); }, [font]);
  useEffect(() => { LS.set('beel:size', fontSize); }, [fontSize]);
  useEffect(() => { LS.set('beel:fav', Array.from(favorites)); }, [favorites]);

  // Load manifest on startup
  useEffect(() => {
    loadManifest().then(setManifest).catch(e => setError(e.message));
  }, []);

  const go = useCallback((next) => {
    setHash(next);
    setRoute(next);
  }, []);

  const toggleFav = (id) => {
    setFavorites(prev => {
      const n = new Set(prev);
      if (n.has(id)) n.delete(id); else n.add(id);
      return n;
    });
  };

  if (error) {
    return (
      <div className="p-6 text-center">
        <p className="text-red-700 mb-2">Could not load the book data.</p>
        <p className="muted text-sm">{error}</p>
        <p className="muted text-xs mt-4">Serve this folder over HTTP (e.g. <code className="font-mono">python3 -m http.server</code>) so the JSON files can be fetched.</p>
      </div>
    );
  }
  if (!manifest) {
    return <div className="p-6 text-center muted">Loading…</div>;
  }

  const sp = { theme, setTheme, font, setFont, fontSize, setFontSize };

  return (
    <div className="min-h-full flex flex-col">
      {route.tab !== 'reader' && (
        <TopBar
          tab={route.tab}
          onSearch={() => go({ tab: 'search' })}
          onSettings={() => go({ tab: 'settings' })}
        />
      )}
      <main className="flex-1 overflow-y-auto pb-24">
        {route.tab === 'reader' ? (
          <Reader
            chapterNum={route.chapter}
            anchor={route.anchor}
            manifest={manifest}
            isFav={favorites.has(route.chapter)}
            onFav={() => toggleFav(route.chapter)}
            go={go}
          />
        ) : route.tab === 'home' ? (
          <Browse manifest={manifest} favorites={favorites} go={go} />
        ) : route.tab === 'search' ? (
          <Search manifest={manifest} go={go} />
        ) : (
          <Settings {...sp} favCount={favorites.size} manifest={manifest} />
        )}
      </main>
      {route.tab !== 'reader' && <BottomNav tab={route.tab} go={go} />}
    </div>
  );
}

/* =========================================================================
   TOP BAR
   ========================================================================= */
function TopBar({ tab, onSearch, onSettings }) {
  const titles = {
    home: "Beelzebub's Tales",
    search: 'Search',
    settings: 'Settings',
  };
  return (
    <header className="surface border-b border-soft pt-safe">
      <div className="flex items-center justify-between px-4 py-3">
        <button onClick={onSettings} aria-label="Settings"
                className="text-2xl muted active:opacity-50">⚙</button>
        <h1 className="text-lg font-semibold tracking-tight">{titles[tab]}</h1>
        <button onClick={onSearch} aria-label="Search"
                className="text-2xl muted active:opacity-50">🔍</button>
      </div>
    </header>
  );
}

/* =========================================================================
   BROWSE — landing page: book title + random + chapter list
   ========================================================================= */
function Browse({ manifest, favorites, go }) {
  const [q, setQ] = useState('');
  const filtered = useMemo(() => {
    const n = q.trim().toLowerCase();
    if (!n) return manifest.chapters;
    return manifest.chapters.filter(c =>
      c.title.toLowerCase().includes(n) ||
      String(c.number) === n.replace('ch', '').trim()
    );
  }, [q, manifest]);
  const random = () => {
    const n = 1 + Math.floor(Math.random() * 48);
    go({ tab: 'reader', chapter: n });
  };

  const favChapters = useMemo(() => {
    return Array.from(favorites)
      .map(n => manifest.chapters.find(c => c.number === n))
      .filter(Boolean)
      .sort((a, b) => a.number - b.number);
  }, [favorites, manifest]);

  return (
    <div className="fade-in">
      <section className="px-5 pt-6 pb-2">
        <p className="muted text-xs uppercase tracking-widest">All and Everything · First Series</p>
        <h2 className="text-2xl font-semibold mt-1 leading-tight">Beelzebub's Tales to His Grandson</h2>
        <p className="muted text-sm mt-1">G. I. Gurdjieff · 1950</p>
      </section>

      {favChapters.length > 0 && (
        <section className="mt-4 px-4">
          <p className="muted text-xs uppercase tracking-widest mb-2 px-1">Favorites</p>
          <div className="flex gap-2 overflow-x-auto no-scrollbar -mx-4 px-4 pb-1">
            {favChapters.map(c => (
              <button
                key={c.number}
                onClick={() => go({ tab: 'reader', chapter: c.number })}
                className="shrink-0 w-44 surface border border-soft rounded-xl px-3 py-2.5 text-start active:opacity-70"
              >
                <span className="accent text-[11px] font-mono uppercase tracking-widest block">★ Ch {c.number}</span>
                <span className="block text-sm font-semibold leading-snug mt-1 line-clamp-2">{c.title}</span>
              </button>
            ))}
          </div>
        </section>
      )}

      <section className="px-4 mt-3">
        <button
          onClick={random}
          className="w-full surface border border-soft rounded-2xl px-4 py-3 text-start active:opacity-80 transition flex items-center gap-3"
        >
          <span className="text-2xl accent">✦</span>
          <span className="flex-1">
            <span className="accent text-xs font-semibold uppercase tracking-widest block">Open at random</span>
            <span className="muted text-xs block mt-0.5">Gurdjieff invited the reader to read each passage three times.</span>
          </span>
        </button>
      </section>

      <div className="px-4 pt-4 pb-2">
        <div className="surface-2 rounded-xl px-3 py-2 flex items-center gap-2">
          <span className="muted">⌕</span>
          <input
            value={q}
            onChange={e => setQ(e.target.value)}
            placeholder="Chapter number or title…"
            className="bg-transparent outline-none flex-1 text-base"
          />
          {q && <button onClick={() => setQ('')} className="muted text-xl leading-none">×</button>}
        </div>
      </div>

      <div className="px-3 pb-6 space-y-2 mt-1">
        {filtered.map(c => (
          <button
            key={c.number}
            onClick={() => go({ tab: 'reader', chapter: c.number })}
            className="w-full surface border border-soft rounded-xl px-4 py-3 text-start active:opacity-70 flex items-start gap-3"
          >
            <span className="accent font-mono text-sm w-7 shrink-0 mt-0.5">{c.number}</span>
            <span className="flex-1">
              <span className="block text-base font-semibold leading-snug">{c.title}</span>
              <span className="block muted text-xs mt-1">{c.paragraphs.toLocaleString()} paragraphs · pp.&nbsp;{c.page_start}–{c.page_end}</span>
            </span>
          </button>
        ))}
        {!filtered.length && (
          <p className="muted text-sm text-center mt-8">No chapter matches.</p>
        )}
      </div>
    </div>
  );
}

/* =========================================================================
   SEARCH — anchor-priority. Type 1.5, 10.2, 48.1238 → instant jump.
   ========================================================================= */
function Search({ manifest, go }) {
  const [q, setQ] = useState('');
  const trimmed = q.trim();
  const isAnchor = useMemo(() => isAnchorQuery(trimmed), [trimmed]);

  // Both anchor and text searches need every chapter loaded — anchors live
  // inside the per-chapter JSON, not the manifest.
  const [allLoaded, setAllLoaded] = useState(chapterCache.size >= 48);
  const [prefetchProgress, setPrefetchProgress] = useState(chapterCache.size);
  useEffect(() => {
    if (allLoaded) return;
    const wantsAll = isAnchor || trimmed.length >= 3;
    if (!wantsAll) return;
    let cancelled = false;
    (async () => {
      const missing = manifest.chapters
        .map(c => c.number)
        .filter(n => !chapterCache.has(n));
      for (const n of missing) {
        if (cancelled) return;
        try { await loadChapter(n); } catch {}
        if (cancelled) return;
        setPrefetchProgress(chapterCache.size);
      }
      setAllLoaded(true);
    })();
    return () => { cancelled = true; };
  }, [trimmed, isAnchor, allLoaded, manifest]);

  // Anchor substring search — like PDF text search but scoped to anchors.
  const ANCHOR_CAP = 200;
  const anchorResults = useMemo(() => {
    if (!isAnchor) return [];
    const out = [];
    for (const ch of manifest.chapters) {
      const doc = chapterCache.get(ch.number);
      if (!doc) continue;
      for (const p of doc.paragraphs) {
        if (p.anchor.includes(trimmed)) {
          out.push({
            chapter: ch.number,
            chapterTitle: ch.title,
            anchor: p.anchor,
            preview: p.text.length > 140 ? p.text.slice(0, 140) + '…' : p.text,
          });
          if (out.length >= ANCHOR_CAP) return out;
        }
      }
    }
    return out;
  }, [trimmed, isAnchor, manifest, allLoaded, prefetchProgress]);

  // Full-text search across loaded chapters (non-numeric queries only)
  const textResults = useMemo(() => {
    if (isAnchor) return [];
    const needle = trimmed.toLowerCase();
    if (needle.length < 3) return [];
    const out = [];
    for (const ch of manifest.chapters) {
      const doc = chapterCache.get(ch.number);
      if (!doc) continue;
      for (const p of doc.paragraphs) {
        const i = p.text.toLowerCase().indexOf(needle);
        if (i >= 0) {
          out.push({
            chapter: ch.number,
            chapterTitle: ch.title,
            anchor: p.anchor,
            preview: makePreview(p.text, i, needle.length),
          });
          if (out.length >= 80) return out;
        }
      }
    }
    return out;
  }, [trimmed, isAnchor, manifest, allLoaded, prefetchProgress]);

  return (
    <div className="fade-in">
      <div className="px-4 pt-4">
        <div className="surface-2 rounded-xl px-3 py-3 flex items-center gap-2">
          <span className="muted">🔎</span>
          <input
            value={q}
            onChange={e => setQ(e.target.value)}
            placeholder="Anchor (1.5, 744, 48.1238) or any text…"
            className="bg-transparent outline-none flex-1 text-base font-mono"
            autoFocus
          />
          {q && <button onClick={() => setQ('')} className="muted text-xl leading-none">×</button>}
        </div>

        {/* Anchor results */}
        {isAnchor && (
          <div className="mt-4">
            {!allLoaded && (
              <p className="muted text-xs mb-2 px-1">
                Indexing… {prefetchProgress}/48 chapters loaded.
              </p>
            )}
            {anchorResults.length > 0 && (
              <>
                <p className="muted text-xs mb-2 px-1">
                  {anchorResults.length}{anchorResults.length >= ANCHOR_CAP ? '+' : ''} anchor match{anchorResults.length === 1 ? '' : 'es'}
                </p>
                <div className="space-y-2 pb-6">
                  {anchorResults.map((r, i) => (
                    <button
                      key={i}
                      onClick={() => go({ tab: 'reader', chapter: r.chapter, anchor: r.anchor })}
                      className="w-full surface border border-soft rounded-xl px-3 py-3 text-start active:opacity-70"
                    >
                      <p className="text-sm font-mono mb-1">
                        {renderAnchorHighlight(r.anchor, trimmed)}
                        <span className="muted"> · {r.chapterTitle}</span>
                      </p>
                      <p className="text-sm leading-relaxed muted">
                        {r.preview}
                      </p>
                    </button>
                  ))}
                </div>
              </>
            )}
            {allLoaded && anchorResults.length === 0 && (
              <p className="muted text-sm text-center mt-8">
                No anchor contains "{trimmed}".
              </p>
            )}
          </div>
        )}

        {/* Text results */}
        {!isAnchor && trimmed.length >= 3 && (
          <div className="mt-4">
            {!allLoaded && (
              <p className="muted text-xs mb-2 px-1">
                Indexing… {prefetchProgress}/48 chapters loaded.
              </p>
            )}
            {textResults.length > 0 && (
              <>
                <p className="muted text-xs mb-2 px-1">{textResults.length} match{textResults.length === 1 ? '' : 'es'}</p>
                <div className="space-y-2 pb-6">
                  {textResults.map((r, i) => (
                    <button
                      key={i}
                      onClick={() => go({ tab: 'reader', chapter: r.chapter, anchor: r.anchor })}
                      className="w-full surface border border-soft rounded-xl px-3 py-3 text-start active:opacity-70"
                    >
                      <p className="muted text-[11px] mb-1 font-mono">
                        <span className="accent">{r.anchor}</span> · {r.chapterTitle}
                      </p>
                      <p className="text-sm leading-relaxed">
                        {renderPreview(r.preview, q)}
                      </p>
                    </button>
                  ))}
                </div>
              </>
            )}
            {allLoaded && textResults.length === 0 && (
              <p className="muted text-sm text-center mt-8">No match. Try a different word or phrase.</p>
            )}
          </div>
        )}

        {/* Empty-state hints */}
        {!q && (
          <div className="mt-6 space-y-4">
            <div>
              <p className="muted text-xs uppercase tracking-widest mb-2 px-1">Anchor shortcuts</p>
              <div className="flex flex-wrap gap-2">
                {['1.5', '744', '24.315', '48.1210-1'].map(a => (
                  <button
                    key={a}
                    onClick={() => setQ(a)}
                    className="surface border border-soft rounded-full px-3 py-1.5 text-sm font-mono active:opacity-70"
                  >{a}</button>
                ))}
              </div>
            </div>
            <div>
              <p className="muted text-xs uppercase tracking-widest mb-2 px-1">Try a word</p>
              <div className="flex flex-wrap gap-2">
                {['Hassein', 'reason', 'planet', 'sleep', 'three-brained'].map(s => (
                  <button
                    key={s}
                    onClick={() => setQ(s)}
                    className="surface border border-soft rounded-full px-3 py-1.5 text-sm active:opacity-70"
                  >{s}</button>
                ))}
              </div>
            </div>
            <div className="surface-2 border border-soft rounded-xl p-4 text-xs leading-6">
              <p className="font-semibold mb-1">How anchors work</p>
              <p className="muted">
                Every paragraph in the print carries a small anchor like
                <span className="font-mono accent"> 1.5</span> (chapter 1, page 5) or
                <span className="font-mono accent"> 48.1210-1</span> (chapter 48, pages 1210–1211).
                A numeric query is matched as a substring against every anchor — so
                <span className="font-mono accent"> 744</span> finds every paragraph whose
                anchor contains <span className="font-mono accent">744</span>, and
                <span className="font-mono accent"> 39.744</span> narrows to that chapter.
              </p>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function renderAnchorHighlight(anchor, needle) {
  if (!needle) return <span className="accent">{anchor}</span>;
  const idx = anchor.indexOf(needle);
  if (idx < 0) return <span className="accent">{anchor}</span>;
  return (
    <>
      <span className="accent">{anchor.slice(0, idx)}</span>
      <mark className="accent-bg text-white rounded px-0.5">{anchor.slice(idx, idx + needle.length)}</mark>
      <span className="accent">{anchor.slice(idx + needle.length)}</span>
    </>
  );
}

function makePreview(text, idx, len) {
  const before = Math.max(0, idx - 60);
  const after  = Math.min(text.length, idx + len + 100);
  return (before > 0 ? '…' : '') + text.slice(before, after) + (after < text.length ? '…' : '');
}
function renderPreview(text, q) {
  const needle = q.trim().toLowerCase();
  if (!needle) return text;
  const out = [];
  const lo = text.toLowerCase();
  let i = 0;
  while (i < text.length) {
    const j = lo.indexOf(needle, i);
    if (j < 0) { out.push(text.slice(i)); break; }
    out.push(text.slice(i, j));
    out.push(<mark key={j} className="accent-bg text-white rounded px-0.5">{text.slice(j, j + needle.length)}</mark>);
    i = j + needle.length;
  }
  return out;
}

/* =========================================================================
   READER — chapter detail with margin anchors, anchor-jump, prev/next
   ========================================================================= */
function Reader({ chapterNum, anchor, manifest, isFav, onFav, go }) {
  const [doc, setDoc] = useState(null);
  const [err, setErr] = useState(null);
  const bodyRef = useRef(null);

  useEffect(() => {
    setDoc(null); setErr(null);
    loadChapter(chapterNum).then(setDoc).catch(e => setErr(e.message));
  }, [chapterNum]);

  // After the chapter renders, scroll to the requested anchor (if any).
  useEffect(() => {
    if (!doc || !anchor) return;
    const el = document.getElementById(`para-${anchor}`);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      el.classList.add('flash');
      const t = setTimeout(() => el.classList.remove('flash'), 1800);
      return () => clearTimeout(t);
    }
    // Fallback: if exact anchor not found, find the first paragraph on that page
    if (anchor.includes('.')) {
      const [chStr, pgStr] = anchor.split('.');
      const targetPage = parseInt(pgStr, 10);
      const p = doc.paragraphs.find(p => p.page_start <= targetPage && p.page_end >= targetPage);
      if (p) {
        const fallback = document.getElementById(`para-${p.anchor}`);
        if (fallback) {
          fallback.scrollIntoView({ behavior: 'smooth', block: 'start' });
          fallback.classList.add('flash');
          const t = setTimeout(() => fallback.classList.remove('flash'), 1800);
          return () => clearTimeout(t);
        }
      }
    }
  }, [doc, anchor]);

  if (err) {
    return (
      <div className="p-6 text-center">
        <p className="text-red-700 mb-2">Could not load chapter {chapterNum}.</p>
        <button onClick={() => go({ tab: 'browse' })} className="accent underline">Back to browse</button>
      </div>
    );
  }
  if (!doc) {
    return (
      <div className="fade-in">
        <ReaderHeader title="Loading…" go={go} chapter={chapterNum} isFav={false} onFav={() => {}} />
        <div className="p-6 muted text-center">Loading chapter {chapterNum}…</div>
      </div>
    );
  }

  const prev = chapterNum > 1 ? manifest.chapters.find(c => c.number === chapterNum - 1) : null;
  const next = chapterNum < 48 ? manifest.chapters.find(c => c.number === chapterNum + 1) : null;

  return (
    <div className="fade-in pb-12">
      <ReaderHeader
        title={doc.title}
        chapter={chapterNum}
        go={go}
        isFav={isFav}
        onFav={onFav}
      />
      <article className="prose-col px-4 sm:px-8 py-8" ref={bodyRef}>
        <p className="muted text-xs uppercase tracking-widest text-center">Chapter {doc.number}</p>
        <h2 className="text-3xl font-semibold text-center mt-2 leading-tight">{doc.title}</h2>
        <div className="ornament my-7">⁂</div>

        {doc.paragraphs.map((p, idx) => (
          <div
            key={p.anchor + '-' + idx}
            id={`para-${p.anchor}`}
            className={`para ${idx === 0 ? 'para-opener' : ''}`}
          >
            <a
              href={`#/ch/${doc.number}/${p.anchor}`}
              className="anchor-tag"
              title={`Cite: ${p.anchor}`}
            >{p.anchor}</a>
            <span className="body block text-lg">
              {p.text}
            </span>
          </div>
        ))}

        <div className="ornament mt-8 mb-6">⁂</div>

        {/* Prev / Next navigation */}
        <div className="flex gap-2">
          {prev ? (
            <button
              onClick={() => go({ tab: 'reader', chapter: prev.number })}
              className="flex-1 surface border border-soft rounded-xl px-4 py-3 text-start active:opacity-70"
            >
              <span className="muted text-xs block">← Chapter {prev.number}</span>
              <span className="text-sm font-semibold block mt-0.5">{prev.title}</span>
            </button>
          ) : <span className="flex-1" />}
          {next ? (
            <button
              onClick={() => go({ tab: 'reader', chapter: next.number })}
              className="flex-1 surface border border-soft rounded-xl px-4 py-3 text-end active:opacity-70"
            >
              <span className="muted text-xs block">Chapter {next.number} →</span>
              <span className="text-sm font-semibold block mt-0.5">{next.title}</span>
            </button>
          ) : <span className="flex-1" />}
        </div>

        {/* Metadata card */}
        <div className="surface-2 rounded-xl p-4 mt-6 text-sm space-y-2">
          <Row k="Chapter"  v={`${doc.number} of 48`} />
          <Row k="Pages"    v={`${doc.page_start}–${doc.page_end}`} />
          <Row k="Paragraphs" v={doc.paragraphs.length.toLocaleString()} />
          <Row k="Permalink" v={`#/ch/${doc.number}`} mono />
          <Row k="URN"       v={doc.urn} mono />
        </div>
      </article>
    </div>
  );
}

function ReaderHeader({ title, chapter, go, isFav, onFav }) {
  return (
    <header className="px-4 py-3 flex items-center justify-between border-b border-soft surface sticky top-0 z-10 pt-safe">
      <button
        onClick={() => {
          if (window.history.length > 1) window.history.back();
          else go({ tab: 'browse' });
        }}
        aria-label="Back"
        className="text-2xl active:opacity-50"
      >←</button>
      <div className="text-center flex-1 mx-3 truncate">
        <p className="text-xs muted">Chapter {chapter}</p>
        <p className="text-sm font-semibold truncate">{title}</p>
      </div>
      <button
        onClick={onFav}
        aria-label="Favorite"
        className="text-2xl active:opacity-50"
      >{isFav ? '★' : '☆'}</button>
    </header>
  );
}

function Row({ k, v, mono }) {
  return (
    <div className="flex items-start justify-between gap-3">
      <span className="muted shrink-0">{k}</span>
      <span className={`text-end ${mono ? 'font-mono text-xs' : ''}`}>{v}</span>
    </div>
  );
}

/* =========================================================================
   SETTINGS
   ========================================================================= */
function Settings({ theme, setTheme, font, setFont, fontSize, setFontSize, favCount, manifest }) {
  return (
    <div className="fade-in px-4 pt-4 pb-8 space-y-5">
      <Section title="Appearance">
        <Picker
          options={THEMES.map(t => ({ id: t.id, label: `${t.emoji}  ${t.label}` }))}
          value={theme}
          onChange={setTheme}
        />
      </Section>

      <Section title="Font">
        <Picker
          options={FONTS.map(f => ({ id: f.id, label: f.label }))}
          value={font}
          onChange={setFont}
        />
      </Section>

      <Section title="Text size">
        <Picker
          options={FONT_SIZES.map(s => ({ id: s.id, label: s.label }))}
          value={fontSize}
          onChange={setFontSize}
        />
      </Section>

      <Section title="Personal library">
        <p className="muted text-sm">Favorited chapters: {favCount}</p>
      </Section>

      <Section title="About">
        <div className="text-sm leading-7 space-y-2">
          <p>Beelzebub's Tales — pre-alpha (v0.2)</p>
          <p className="muted">
            {manifest.counts.chapters} chapters · {manifest.counts.chapter_paragraphs.toLocaleString()} paragraphs ·
            {' '}{manifest.counts.distinct_pages.toLocaleString()} pages.
          </p>
          <p className="muted">
            Text in the public domain. Code MIT-licensed. Page anchors via the
            joshuatilton/Vellum 2019 typesetting.
          </p>
        </div>
      </Section>
    </div>
  );
}

function Section({ title, children }) {
  return (
    <div>
      <h2 className="text-xs font-semibold muted mb-2 px-1 uppercase tracking-widest">{title}</h2>
      <div className="surface border border-soft rounded-2xl p-3">{children}</div>
    </div>
  );
}

function Picker({ options, value, onChange }) {
  return (
    <div className="flex gap-1.5 flex-wrap">
      {options.map(o => (
        <button
          key={o.id}
          onClick={() => onChange(o.id)}
          className={`px-3 py-2 rounded-lg text-sm border transition flex-1 min-w-[5rem]
            ${value === o.id ? 'accent-bg text-white border-transparent' : 'border-soft surface-2'}`}
        >
          {o.label}
        </button>
      ))}
    </div>
  );
}

/* =========================================================================
   BOTTOM NAV
   ========================================================================= */
function BottomNav({ tab, go }) {
  const items = [
    { id: 'home',     label: 'Chapters', emoji: '📖' },
    { id: 'search',   label: 'Search',   emoji: '🔍' },
    { id: 'settings', label: 'Settings', emoji: '⚙' },
  ];
  return (
    <nav className="surface border-t border-soft fixed bottom-0 inset-x-0 pb-safe z-20">
      <div className="grid grid-cols-3">
        {items.map(it => (
          <button
            key={it.id}
            onClick={() => go({ tab: it.id })}
            className={`py-3 flex flex-col items-center gap-0.5 text-xs ${tab === it.id ? 'accent' : 'muted'}`}
          >
            <span className="text-xl">{it.emoji}</span>
            <span>{it.label}</span>
          </button>
        ))}
      </div>
    </nav>
  );
}
